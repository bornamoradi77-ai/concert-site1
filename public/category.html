<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دسته‌بندی موسیقی | Concertino</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <nav class="navbar container">

        <a href="index.html" class="logo">
            Concert<span>ino</span>
        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    خانه
                </a>
            </li>


            <li>
                <a href="index.html#concerts">
                    کنسرت‌ها
                </a>
            </li>


            <li>
                <a href="index.html#categories">
                    دسته‌بندی‌ها
                </a>
            </li>

        </ul>


        <div class="nav-actions">

            <a
                href="login.html"
                class="btn btn-primary"
            >
                ورود
            </a>

        </div>

    </nav>

</header>



<!-- =========================================
     CATEGORY HERO
========================================= -->

<section class="category-hero">

    <div>

        <p
            style="
                color:#00ffff;
                font-size:13px;
                letter-spacing:3px;
                margin-bottom:10px;
            "
        >
            MUSIC CATEGORY
        </p>


        <h1 id="categoryTitle">
            خواننده‌ها
        </h1>


        <p id="categoryDescription">
            خواننده‌های این دسته‌بندی
        </p>

    </div>

</section>



<!-- =========================================
     ARTISTS
========================================= -->

<main class="container">

    <section class="section">

        <div class="section-title">

            <h2>
                خواننده‌های این دسته‌بندی
            </h2>

            <p>
                خواننده مورد نظر خودت را انتخاب کن و کنسرت‌هایش را ببین.
            </p>

        </div>


        <div
            class="artist-grid"
            id="artistContainer"
        ></div>

    </section>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="copyright">

        © ۱۴۰۵ Concertino

    </div>

</footer>



<!-- =========================================
     APP JS
========================================= -->

<script src="js/app.js"></script>



<!-- =========================================
     CATEGORY PAGE SCRIPT
========================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    /*
        خواننده‌ها از artists داخل app.js گرفته می‌شوند.
        کنسرت‌ها هم از concerts داخل app.js گرفته می‌شوند.
    */

    const container =
        document.getElementById("artistContainer");


    if (!container) {
        return;
    }


    /*
        گرفتن نوع دسته‌بندی از آدرس

        مثال:

        category.html?type=pop

        یا:

        category.html?type=rock
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const type =
        params.get("type") || "pop";



    /* =========================================
       عنوان دسته‌بندی
    ========================================= */

    const categoryInfo = {

        pop: {
            title: "موسیقی پاپ",
            description:
                "بهترین خواننده‌های پاپ و کنسرت‌های آن‌ها"
        },

        rock: {
            title: "موسیقی راک",
            description:
                "گروه‌ها و هنرمندان موسیقی راک"
        },

        traditional: {
            title: "موسیقی سنتی",
            description:
                "هنرمندان و خوانندگان موسیقی سنتی"
        },

        electronic: {
            title: "موسیقی الکترونیک",
            description:
                "دی‌جی‌ها و هنرمندان موسیقی الکترونیک"
        }

    };


    const info =
        categoryInfo[type] ||
        categoryInfo.pop;


    document.getElementById(
        "categoryTitle"
    ).textContent = info.title;


    document.getElementById(
        "categoryDescription"
    ).textContent = info.description;



    /* =========================================
       پیدا کردن خواننده‌ها
    ========================================= */

    let selectedArtists = [];


    if (
        typeof artists !== "undefined" &&
        artists[type]
    ) {

        selectedArtists =
            artists[type];

    }



    /* =========================================
       اگر خواننده‌ای وجود نداشت
    ========================================= */

    if (selectedArtists.length === 0) {

        container.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:70px 20px;
                    color:#94a3b8;
                "
            >

                <div
                    style="
                        font-size:50px;
                        margin-bottom:15px;
                    "
                >
                    🎵
                </div>

                <h3
                    style="
                        color:white;
                        margin-bottom:10px;
                    "
                >
                    هنوز هنرمندی در این دسته‌بندی وجود ندارد
                </h3>

                <p>
                    به‌زودی کنسرت‌های بیشتری اضافه می‌شوند.
                </p>

            </div>

        `;

        return;

    }



    /* =========================================
       ساخت کارت خواننده‌ها
    ========================================= */

    container.innerHTML =
        selectedArtists
        .map(function (artist) {


            /*
                پیدا کردن کنسرت مربوط به خواننده

                نام خواننده در artists
                ممکن است فارسی باشد
                و در concerts هم فارسی یا انگلیسی باشد.

                بنابراین چند حالت را بررسی می‌کنیم.
            */


            let concert = null;


            if (
                typeof concerts !== "undefined"
            ) {

                concert =
                    concerts.find(function (item) {

                        return (

                            item.artist === artist.name ||

                            item.artist
                                .toLowerCase?.()
                                .includes(
                                    artist.name.toLowerCase()
                                )

                        );

                    });

            }



            /*
                اگر کنسرت پیدا شد،
                دکمه خرید واقعی است.
            */

            let buttonHTML = "";


            if (concert) {

                buttonHTML = `

                    <a
                        href="concert.html?id=${concert.id}"
                        class="btn btn-primary"
                        style="
                            width:calc(100% - 30px);
                            margin:0 15px 20px;
                        "
                    >
                        🎟️ مشاهده و خرید بلیت
                    </a>

                `;

            }


            /*
                اگر برای این خواننده
                هنوز کنسرتی در concerts
                تعریف نشده باشد.
            */

            else {

                buttonHTML = `

                    <button
                        class="btn"
                        disabled
                        style="
                            width:calc(100% - 30px);
                            margin:0 15px 20px;
                            opacity:0.45;
                            cursor:not-allowed;
                        "
                    >
                        🎵 کنسرتی موجود نیست
                    </button>

                `;

            }



            return `

                <div class="artist-card">

                    <img
                        src="${artist.image}"
                        alt="${artist.name}"
                        onerror="
                            this.style.display='none';
                        "
                    >


                    <div
                        style="
                            padding:18px 15px 0;
                        "
                    >

                        <h3
                            style="
                                padding:0;
                                margin-bottom:8px;
                            "
                        >
                            ${artist.name}
                        </h3>


                        ${
                            concert
                            ? `
                                <p
                                    style="
                                        color:#94a3b8;
                                        font-size:13px;
                                        margin-bottom:15px;
                                    "
                                >
                                    🎤 ${concert.title}
                                </p>
                              `
                            : `
                                <p
                                    style="
                                        color:#64748b;
                                        font-size:13px;
                                        margin-bottom:15px;
                                    "
                                >
                                    به‌زودی
                                </p>
                              `
                        }

                    </div>


                    ${buttonHTML}

                </div>

            `;

        })
        .join("");

});

</script>


</body>

</html>
