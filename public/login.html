<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | Concertino</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="header">

    <nav class="navbar">

        <a href="index.html" class="logo">
            Concert<span>ino</span>
        </a>

    </nav>

</header>


<div class="form-container">

    <div class="form-card">

        <h1>
            ورود به حساب
        </h1>

        <p class="form-description">
            ورود در این نسخه صرفاً نمایشی است.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>
                    ایمیل
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    رمز عبور
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="رمز عبور"
                    required
                >

            </div>

            <button
                class="btn btn-primary"
                type="submit"
            >
                ورود
            </button>

        </form>

        <div class="form-footer">

            حساب ندارید؟

            <a href="register.html">
                ثبت‌نام کنید
            </a>

        </div>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
